# Netlify configuration for georglynx.com

[build]
  publish = "."
  # Bundle mahbles-data/*.json into one mahbles-all.json so the Mahbles page
  # makes a single request instead of ~60 to the GitHub API on every visit.
  command = "node build-mahbles.js"

# The Cozzie Livs Calc was archived (git tag `calc-archive`). Send old links home.
# Two rules: the splat does not match a bare `/calc` on its own.
[[redirects]]
  from = "/calc"
  to = "/"
  status = 301

[[redirects]]
  from = "/calc/*"
  to = "/"
  status = 301
